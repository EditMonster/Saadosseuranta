name: Päivitä säädösaineisto

on:
  schedule:
    # Arkisin kolmesti: 05:40, 10:40 ja 14:40 UTC = 7:40, 12:40 ja 16:40 talviaikaan (8:40, 13:40, 17:40 kesäaikaan)
    - cron: "40 5,10,14 * * 1-5"
    # Viikonloppuisin kerran aamulla
    - cron: "40 6 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Hae lähteet ja rakenna aineisto
        run: python scripts/update.py

      # Rikkinäistä aineistoa ei committata: build.py:n raja-arvot + rakenteen eheystestit.
      - name: Aineiston eheys
        run: pytest tests/test_data.py -q

      - name: Tallenna muutokset
        run: |
          git config user.name "saadosseuranta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache docs/data
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Aineisto päivitetty $(date -u +%Y-%m-%d)"
            git push
          fi

      # Lähdevahti: avaa issuen (= sähköposti), kun lähde on epäonnistunut 3 ajoa peräkkäin, ja sulkee sen, kun lähde toipuu.
      - name: Lähdevahti
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/health_report.py --issue

  # Botin push ei käynnistä muita työnkulkuja, joten testit ja Pages-julkaisu kutsutaan tästä.
  julkaise:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
