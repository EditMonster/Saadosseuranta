name: Päivitä säädösaineisto

# Herätys joka tunti; scripts/ajastus.py päättää, ajetaanko (ks. sen ohje):
#   * täysi ajo arkisin klo 7, 12 ja 16 ja viikonloppuisin klo 9 Suomen aikaa (kesä-/talviaika huomioiden);
#     jos GitHub pudottaa tai viivästää herätyksen, väliin jäänyt ajo tehdään seuraavalla tunnilla
#   * epäonnistuneiden lähteiden uusintayritys 2 tunnin välein klo 7–22 (esim. lähteen huoltokatko)
#   * muuten herätys päättyy ~15 sekunnissa.
# Minuutti 11 välttää tasatuntien ruuhkan, jolloin GitHub pudottaa ajastuksia useimmin.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      vaiheet:
        description: "Vain nämä lähteet (välilyönnillä erotettuna, esim. 'mao caselaw'); tyhjä = kaikki"
        required: false
        default: ""
      ajastin:
        description: "Anna ajastimen päättää, ajetaanko (ulkoinen herättäjä, esim. cron-job.org, lähettää ajastin=true)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  ajastin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      steps: ${{ steps.decide.outputs.steps }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ajastus.py
            data/cache/health.json
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.ajastin && 'true' || 'false' }}
          FORCE_STEPS: ${{ inputs.vaiheet }}
        run: python3 scripts/ajastus.py

  update:
    needs: ajastin
    if: needs.ajastin.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Skannattujen lausuntojen tekstintunnistus (fetch_lausunnot): pdftoppm + tesseract suomeksi ja ruotsiksi
      - name: Tekstintunnistus
        run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fin tesseract-ocr-swe >/dev/null || echo "OCR-työkaluja ei saatu asennettua – skannatut lausunnot jäävät lukematta"

      - name: Hae lähteet ja rakenna aineisto
        env:
          VAIHEET: ${{ needs.ajastin.outputs.steps }}
        run: python scripts/update.py $VAIHEET

      # Rikkinäistä aineistoa ei committata: build.py:n raja-arvot + rakenteen eheystestit.
      - name: Aineiston eheys
        run: pytest tests/test_data.py -q

      - name: Tallenna muutokset
        run: |
          git config user.name "saadosseuranta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache docs/data
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Aineisto päivitetty $(date -u +%Y-%m-%d)"
            # Jos main on ehtinyt liikkua ajon aikana (käsin tehty push), rebase ja yritä uudelleen
            for i in 1 2 3; do
              git push && break
              echo "push epäonnistui, yritys $i: haetaan uusin main ja tehdään rebase"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 10
            done
          fi

      # Lähdevahti: avaa issuen (= sähköposti), kun lähde on epäonnistunut 3 ajoa peräkkäin, ja sulkee sen, kun lähde toipuu.
      - name: Lähdevahti
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/health_report.py --issue

      # Ajovahti: koko ajon epäonnistuminen avaa issuen (linkki lokiin); seuraava onnistunut ajo sulkee sen.
      - name: Ajon tulos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/vahti.py run-result --status ${{ job.status == 'success' && 'success' || 'failure' }} --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Botin push ei käynnistä muita työnkulkuja, joten testit ja Pages-julkaisu kutsutaan tästä.
  julkaise:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
