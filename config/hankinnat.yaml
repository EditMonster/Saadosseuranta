  "22": Alihankintailmoitus – puolustus ja turvallisuus
  "23": Suunnittelukilpailu
  "24": Suunnittelukilpailu – erityisalat
  "E3": Kansallinen hankintailmoitus
  "9902": Kansallinen hankintailmoitus
  "9911": Kansallinen hankintailmoitus – puolustus ja turvallisuus
  "9912": Pienhankinta
  "9913": Pienhankinta – SOTE ja erityiset palvelut
