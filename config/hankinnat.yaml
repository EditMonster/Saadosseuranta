# Kilpailutukset (Hilma): toimialaluokitus CPV-koodin perusteella ja näyttöasetukset.
#
# Toimiala valitaan pisimmän täsmäävän CPV-etuliitteen mukaan (esim. 791 voittaa 79:n).
# Ilmoituksen pääkoodin lisäksi katsotaan osien (lots) koodit, joten monialainen kilpailutus
# voi kuulua useaan toimialaan. Koodi, jolle ei löydy etuliitettä, saa toimialan "Muut".
toimialat:
  Rakentaminen ja infra: ["44", "45"]
  Suunnittelu ja tekninen konsultointi: ["71"]
  ICT ja ohjelmistot: ["30", "32", "48", "64", "72"]
  Sosiaali- ja terveyspalvelut: ["85", "98"]
  Lääkkeet ja hoitotarvikkeet: ["33"]
  Lakipalvelut: ["791"]
  Konsultointi ja liike-elämän palvelut: ["79", "66", "75"]
  Koneet, laitteet ja tarvikkeet: ["14", "16", "18", "19", "22", "24", "31", "37", "38", "39", "42", "43"]
  Ajoneuvot ja kuljetus: ["34", "60", "63"]
  Kiinteistö- ja huoltopalvelut: ["50", "51", "70", "909"]
  Energia ja polttoaineet: ["09", "41", "65", "76"]
  Ympäristö, viheralueet ja jätehuolto: ["77", "90"]
  Elintarvikkeet ja ruokapalvelut: ["03", "15", "55"]
  Turvallisuus ja puolustus: ["35", "797"]
  Koulutus, tutkimus ja kulttuuri: ["73", "80", "92"]

