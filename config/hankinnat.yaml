# Hankinnan vaihe päätellään ilmoituksen päätyypistä (mainType); nämä tyyppikoodit poikkeavat päätyypistään:
# suorahankinnan avoimuusilmoitukset (eF25–28) ovat Hilmassa ennakkoilmoitusten joukossa ja kansallinen
# suorahankintailmoitus (9905) jälki-ilmoitusten joukossa. Suorahankinnasta voi valittaa 14 päivän kuluessa
# ilmoituksen julkaisemisesta (hankintalaki 147 § 3 mom.), ja sopimuksen saa tehdä aikaisintaan 14 päivän
# kuluttua julkaisusta (131 §) – siksi niille lasketaan tarkka valitusajan päättymispäivä.
suorahankinta_tyypit: ["25", "26", "27", "28", "9905"]
valitusaika_paivia: 14

menettelyt:
  open: Avoin menettely
  restricted: Rajoitettu menettely
  neg-w-call: Neuvottelumenettely
  neg-wo-call: Neuvottelumenettely ilman ilmoitusta
  comp-dial: Kilpailullinen neuvottelumenettely
  comp-tend: Kilpailullinen menettely
  innovation: Innovaatiokumppanuus
  oth-single: Muu yksivaiheinen menettely
  oth-mult: Muu monivaiheinen menettely

# Menettelyt, joissa määräaika koskee osallistumishakemusta tarjouksen sijaan
osallistumishakemus: ["restricted", "neg-w-call", "comp-dial", "innovation", "oth-mult"]

hankintalajit:
  services: Palvelut
  supplies: Tavarat
  works: Rakennusurakat

# Tiivistelmästä pudotettavat vakiolauseet (pieni kirjain, osuma riittää)
tiivistelma:
  max_merkkia: 420
  ohita:
    - "ei makseta korvausta"
    - "tutustua kohteeseen"
    - "kuvattu tarkemmin tarjouspyyn"
    - "kuvattu tarkemmin osallistumispyyn"
    - "on kuvattu yksityiskohtaisesti"
    - "katso tarkemmin"
    - "lisätietoja"
    - "tarjous on sitova"
    - "tulee laatia suomen kielellä"
    - "hankintaprosessi on kokonaisuudessaan"
    - "selvyyden vuoksi"
    - "pidättää oikeuden"
    - "hankintayksikkö varaa oikeuden"
    - "tarjouspyynnön ja sen liitteiden mukaisesti."
