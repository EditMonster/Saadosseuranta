  "7": Ennakkoilmoitus määräaikojen lyhentämiseksi
  "8": Ohjeellinen kausi-ilmoitus määräaikojen lyhentämiseksi – erityisalat
  "9": Ennakkoilmoitus määräaikojen lyhentämiseksi – puolustus ja turvallisuus
