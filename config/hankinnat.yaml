  "34": Jälki-ilmoitus – erityisalat – SOTE ja erityiset palvelut
  "35": Jälki-ilmoitus – käyttöoikeussopimus – SOTE ja erityiset palvelut
  "36": Suunnittelukilpailun tulokset
