  "10": Tarjouskilpailukutsuna käytettävä ennakkoilmoitus
  "11": Tarjouskilpailukutsuna käytettävä ennakkoilmoitus – erityisalat
  "12": Tarjouskilpailukutsuna käytettävä ennakkoilmoitus
  "13": Tarjouskilpailukutsuna käytettävä ennakkoilmoitus – erityisalat
