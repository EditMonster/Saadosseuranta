# Oikeuskäytäntö: mitkä tuomioistuimet haetaan ja miten ratkaisujen säädösviittaukset tulkitaan.
#
# Lähteet: tuomioistuinten omat sivustot (korkeinoikeus.fi, kho.fi, tyotuomioistuin.fi,
# vakuutusoikeus.fi, markkinaoikeus.fi – julkaisevat samana päivänä) ja www.finlex.fi:n vuosiluettelot
# (hovi- ja hallinto-oikeudet, joilla ei ole omaa julkaisukanavaa; 1–7 pv viive). EUT ja Suomen
# tuomioistuinten ennakkoratkaisupyynnöt haetaan Publications Officen Cellar-tietokannasta (eut-lohko).

# Kuinka monta päivää ratkaisut pidetään mukana (antopäivästä). Vireillä olevat suomalaiset
# ennakkoratkaisupyynnöt pidetään aina, kunnes niihin on annettu tuomio.
keep_days: 120

courts:
  KKO:
    name: Korkein oikeus
    enabled: true
    source: rss                      # https://<host>/feed/rss-feed?post_type=ratkaisu + ratkaisusivu
    host: www.korkeinoikeus.fi
    finlex: korkein-oikeus/ennakkopaatokset   # Finlex-osoite: www.finlex.fi/fi/oikeuskaytanto/<finlex>/<vuosi>/<n>
    fallback_finlex: true            # jos oma sivusto ei vastaa, haetaan Finlexin vuosiluettelosta
    kind: Ennakkopäätös
  KHO:
    name: Korkein hallinto-oikeus
    enabled: true
    source: kho                      # kho.fi:n RSS on rikki -> arkistosivu (content-lift-lista) + ratkaisusivu
    archive: https://www.kho.fi/kho-paatokset/ennakkopaatokset/arkisto/
    finlex: korkein-hallinto-oikeus/ennakkopaatokset
    fallback_finlex: true            # jos oma sivusto ei vastaa, haetaan Finlexin vuosiluettelosta
    kind: Vuosikirjapäätös
    # Muut julkaistut päätökset (ECLI ...:T2501) samasta arkistomuodosta; noin 200/v, oletuksena pois
    muut: false
    muut_archive: https://www.kho.fi/kho-paatokset/muut-julkaistut-paatokset/arkisto/
  TT:
    name: Työtuomioistuin
    enabled: true
    source: rss
    host: www.tyotuomioistuin.fi
    finlex: tyotuomioistuin
    fallback_finlex: true            # jos oma sivusto ei vastaa, haetaan Finlexin vuosiluettelosta
    kind: Tuomio
  VakO:
    name: Vakuutusoikeus
    enabled: false
    source: rss
    host: www.vakuutusoikeus.fi
    finlex: vakuutusoikeus
    fallback_finlex: true            # jos oma sivusto ei vastaa, haetaan Finlexin vuosiluettelosta
    kind: Ratkaisu
  MAO:
    name: Markkinaoikeus
    enabled: true
    source: mao                      # vain IPR- ja markkinaoikeudelliset asiat; hankinta- ja kilpailuasiat hoitaa fetch_mao.py
    categories:
      ipr: https://www.markkinaoikeus.fi/ratkaisut/teollis-ja-tekijanoikeudelliset-asiat/
      markkinaoikeudellinen: https://www.markkinaoikeus.fi/ratkaisut/markkinaoikeudelliset-asiat/
    finlex: markkinaoikeus
    kind: Ratkaisu
  HO:
    name: Hovioikeudet
    enabled: true
    source: finlex
    finlex: hovioikeudet
    kind: Ratkaisu
  HaO:
    name: Hallinto-oikeudet
    enabled: true
    source: finlex
    finlex: hallinto-oikeudet
    kind: Ratkaisu

# www.finlex.fi rajoittaa pyyntöjä (429 alle 1,5 s välein); sivut ovat 200–500 kt
finlex:
  delay: 1.5
  max_pages_per_run: 40            # uusia ratkaisusivuja enintään per ajo (loput seuraavalla kerralla)

# Aihealueluokittelun lisäavainsanat ratkaisuille (yhdistetään config/topics.yaml:n listoihin; sama logiikka:
# avainsana saa olla sanan alku, kirjainkoko ei merkitse). Ratkaisujen asiasanat ovat suppeampia kuin säädösten nimet.
aihealueet:
  Rikos ja prosessi:
    - syyteoikeus
    - syyte
    - rangaist
    - tutkintavank
    - oikeudenkäynnin julkisuus
    - todistel
    - menettämisseuraamu
    - oikeudenkäyntikulu
    - ennakkoratkaisupyyntö
  Työoikeus:
    - työsuhteen päättäminen
    - työehtosopimu
    - luottamuspula
    - palkkasaatav
    - lomautt
  Verotus:
    - osakaslaina
    - pääomatulo
    - verovuo
    - tuloverolaki
    - elinkeinotulo
  Kuluttaja ja tuotteet:
    - sopimaton menettely
    - tavaramerk
    - patent
    - tekijänoikeu
    - mallioikeu
    - toiminimi
    - liikesalaisuu
    - markkinaoikeudelli
  Hallinto ja hankinnat:
    - julkinen hankinta
    - valituslupa
    - asiakirjajulkisuus
    - tietopyyntö
  Sote ja koulutus:
    - asumistu
    - työeläke
    - tapaturma
    - kuntoutu
    - toimeentulotu
  Maahanmuutto:
    - kansainvälistä suojelua
    - turvapaikanhak
    - oleskelulup
    - karkott

