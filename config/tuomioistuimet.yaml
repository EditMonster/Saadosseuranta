# Euroopan unionin tuomioistuin (Cellar SPARQL). Pidetään tuomiot ja julkisasiamiehen ratkaisuehdotukset,
# jotka (a) ovat lähtöisin Suomesta (originates_in_country FIN), (b) kuuluvat vireillä olevaan suomalaiseen
# ennakkoratkaisupyyntöön (asianumero), (c) tulkitsevat seurattua EU-säädöstä (CELEX data/cache/eu.json:ssa
# tai watch_celex-listalla) tai (d) joiden aihealuekoodi on subject_codes-listalla. Suomalaiset
# ennakkoratkaisupyynnöt (EUVL C -ilmoitukset) haetaan aina.
eut:
  days: 45                 # tuomiot ja ratkaisuehdotukset viimeisiltä n päivältä (sama ikkuna kysytään joka ajo:
                           # maa-, aihe- ja otsikkotiedot täydentyvät Cellarissa päiviä–viikkoja myöhemmin)
  references_since: "2024-01-01"   # ennakkoratkaisupyyntöilmoitukset tästä julkaisupäivästä alkaen
  text_fetches_per_run: 12         # suomenkielisiä tekstejä (tuomiolauselma, ratkaisuehdotuksen otsake, kysymykset) enintään per ajo
  watch_celex: []                  # lisäksi seurattavat säädökset, esim. ["32016R0679", "32014L0024"]
  subject_codes:                   # case-law-subject-matter -koodit (kaikki 186 suomeksi: config/eut_aiheet.yaml)
    - MAPU      # Julkiset hankinnat
    - MARC      # Euroopan unionin julkiset hankinnat
    - TVA       # Arvonlisävero
    - FISC      # Verotus
    - ACCI      # Valmisteverot
    - UDOU      # Tulliliitto ja yhteinen tullitariffi
    - CODO      # Tullikoodeksi
    - PDON      # Henkilötietojen suoja
    - DOCU      # Asiakirjajulkisuus
    - CONS      # Kuluttajansuoja
    - MARQ      # Tavaramerkit
    - DADV      # Tekijänoikeus ja lähioikeudet
    - BREV      # Patentit
    - PIIC      # Teollisoikeudet ja kaupalliset oikeudet
    - CONC      # Kilpailu
    - ENTE      # Kartellit tai muut yhteisjärjestelyt
    - PODO      # Määräävä markkina-asema
    - MERG      # Yrityskeskittymät
    - AIDE      # Valtiontuki
    - RMSN      # Digitaalisten markkinoiden ja palvelujen sääntely
    - SEFI      # Rahoituspalvelut
    - ENER      # Energiapolitiikka
    - ENVI      # Ympäristö
    - EQEG      # Kasvihuonekaasujen päästöoikeuksien kauppa
    - DSOC      # Sosiaalilainsäädäntö
    - PSOC      # Sosiaalipolitiikka
    - EMPL      # Työllisyys
    - SESO      # Sosiaaliturva
    - LPSE      # Palvelujen tarjoamisen vapaus
    - ETAB      # Sijoittautumisvapaus
    - COJC      # Oikeudellinen yhteistyö yksityisoikeudellisissa asioissa
    - ASIL      # Turvapaikkapolitiikka
    - IMMI      # Maahanmuuttopolitiikka
