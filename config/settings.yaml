# Säädösseurannan asetukset

site:
  name: Säädösseuranta
  # Näytetäänkö kansallisella sivulla myös hankkeet, joilla ei ole vielä yhtään päivämäärää
  show_items_without_dates: true

eu:
  # Vuodet, joiden EP-menettelyt haetaan (menettelyn aloitusvuosi)
  years: [2021, 2022, 2023, 2024, 2025, 2026]
  # Tavallinen lainsäätämisjärjestys (COD). Lisää "NLE" jos haluat myös hyväksyntämenettelyt.
  procedure_types: [COD]

completed:
  # Valmiit-sivulla näytetään säädökset, joiden voimaantulosta on enintään näin monta päivää
  max_age_days: 730

sanity:
  # Jos rakennettu aineisto on tätä pienempi, ajo keskeytyy eikä vanhaa items.jsonia korvata
  fi: 100
  eu: 30
  done: 50

changelog:
  # Kuinka monta päivää muutoksia säilytetään docs/data/changes.json-tiedostossa
  keep_days: 90

hys:
  # Komission "Have your say": montako 100 aloitteen sivua haetaan (uusimmat ensin) ja
  # kuinka monta päivää päättyneet palauteajat pidetään mukana
  pages: 6
  keep_closed_days: 60

hankinnat:
  # Hilma: kuinka monta päivää päättyneet tai Hilmasta poistuneet kilpailutukset pidetään mukana
  # (seurattu kilpailutus ei katoa heti määräajan umpeuduttua), CPV-nimikkeistön päivitysväli ja
  # pienin hyväksyttävä avointen ilmoitusten määrä (pienempi tulos tulkitaan hakuvirheeksi)
  keep_closed_days: 14
  cpv_refresh_days: 90
  min_items: 100
  # Jälki-ilmoitukset (ratkaistut hankinnat) näytetään näin monta päivää julkaisusta
  award_days: 30

yrityskaupat:
  # KKV:n ja komission yrityskauppavalvonta: kuinka monta päivää ratkaistut tapaukset pidetään mukana,
  # ja kuinka vanhoja komission ilmoituksia haetaan (vaihe 2 -tapaukset haetaan aina)
  keep_decided_days: 90
  eu_notified_days: 120

# Delegoidut säädökset hyväksymisen jälkeen (komission delegoitujen säädösten rekisteri)
delegoidut:
  keep_days: 90          # kuinka kauan julkaistut / vastustetut / peruutetut säädökset näkyvät
  stale_days: 400        # rekisterissä on muutama vanha tapaus, jota ei koskaan päätetty – ne ohitetaan

# Markkinaoikeuden hankinta-asiat (vireillä-luettelo ja ratkaisut) sekä kilpailuasioiden ratkaisut
markkinaoikeus:
  keep_days: 90          # kuinka kauan ratkaistut ja luettelosta poistuneet asiat näkyvät
  kho_valitusaika_paivia: 30   # valitusaika KHO:een (valituslupa, hankintalaki 165 §) – arvio antopäivästä

# Vaikuttamisen jäljet: ketkä lausuivat (Hankeikkunan LAUSUNTO-asiakirjat) ja ketkä lobbasivat (avoimuusrekisteri)
vaikuttaminen:
  avoimuusrekisteri:
    terms: 2             # montako viimeisintä päättynyttä ilmoituskautta (6 kk) haetaan
    refresh_days: 1      # rekisteri pyytää kevyttä käyttöä: haetaan enintään kerran päivässä

# Eduskunnan valiokuntasyöte (avoindata.eduskunta.fi, VaskiData): esityslistat ja kuultavat, asiantuntijalausunnot,
# valiokuntien mietinnöt ja lausunnot sekä kirjalliset kysymykset ja aloitteet
vaski:
  bootstrap_rows: 6000        # ensimmäisellä ajolla luetaan näin monta uusinta riviä (≈ 6 viikkoa istuntokaudella)
  agenda_keep_days: 7         # pidetyt kokoukset pudotetaan näin monen päivän jälkeen
  statement_keep_days: 400    # asia pysyy mukana, kun sillä on lausunto tältä ajalta
  report_keep_days: 400       # mietinnöt ja lausunnot
  motion_keep_days: 120       # kirjalliset kysymykset, laki-, toimenpide- ja kansalaisaloitteet
  backfill_max_requests: 700  # kuluvan vuoden mietintöjen kertatäydennys (jatkuu seuraavalla ajolla, jos raja täyttyy)

# TED (EU:n virallinen lehti S, api.ted.europa.eu v3): naapurimaiden hankinta- ja ennakkoilmoitukset
# samoilta toimialoilta kuin Hilma-seuranta. Suomen ilmoitukset tulevat Hilmasta, joten FI ei ole listalla.
ted:
  enabled: true
  maat: ["SE", "NO", "DK", "EE", "LV", "LT"]   # ISO 3166-1 alpha-2 lainausmerkeissä (YAML lukisi NO:n epätotena); Pohjoismaat ja Baltia
  days: 7                  # kuinka monen päivän julkaisut haetaan joka ajossa (ilmoitus säilyy määräaikaansa asti)
  backfill_days: 45        # listalle lisätystä maasta haetaan ensimmäisellä kerralla näin monen päivän ilmoitukset
  cpv: []                  # tyhjä = config/hankinnat.yaml toimialojen CPV-etuliitteet ("72*"-muodossa)
  pin_days: 90             # ennakkoilmoitukset (pin-*) ilman määräaikaa pidetään näin monta päivää julkaisusta

# Kuntien hankintapäätökset: Helsinki (Ahjo / paatokset.hel.fi, avoin Elasticsearch-välityspalvelin); Oulu (Tweb-RSS) valinnaisena.
# days = kuinka monen päivän päätökset haetaan, keep_days = kuinka kauan päätös näkyy (valitusaika on arvio: päätös + 7 + 14 pv)
paatokset:
  days: 45
  keep_days: 60
  helsinki: true
  oulu: false

# Tutkihankintoja.fi (valtion ostolaskut, Hansel/Valtiokonttori, CC BY 4.0): hankintayksikön suurimmat toimittajat viimeisten 12 kk ajalta.
# key = sivuston oma julkinen avain selainpaketista (assets/index-*.js, "subscription-key="); sivusto voi vaihtaa sen – 401/403 keskeyttää haun.
# kategoriat = Hilman CPV-toimiala -> Tutkihankintoja-hankintakategoria(t), joiden toimittajat haetaan toimialan kilpailutuksille
toimittajat:
  enabled: true
  key: "7215f8f3b03b49f68855f801a2bf725c"
  max_buyers: 40
  refresh_days: 30
  kategoriat:
    Rakentaminen ja infra: ["Rakentaminen", "Alueet ja väylät"]
    Suunnittelu ja tekninen konsultointi: ["Asiantuntija- ja toimistopalvelut", "Rakentaminen"]
    ICT ja ohjelmistot: ["ICT-hankinnat (tavarat, palvelut ja ohjelmistot)"]
    Sosiaali- ja terveyspalvelut: ["Henkilöstöpalvelut"]
    Lääkkeet ja hoitotarvikkeet: ["Aineet, tarvikkeet ja tavarat"]
    Lakipalvelut: ["Asiantuntija- ja toimistopalvelut"]
    Konsultointi ja liike-elämän palvelut: ["Asiantuntija- ja toimistopalvelut", "Hallinnolliset palvelut"]
    Koneet, laitteet ja tarvikkeet: ["Koneet, laitteet ja kuljetusvälineet", "Aineet, tarvikkeet ja tavarat"]
    Ajoneuvot ja kuljetus: ["Koneet, laitteet ja kuljetusvälineet", "Matkustus- ja kuljetuspalvelut"]
    Kiinteistö- ja huoltopalvelut: ["Rakennusten ja alueiden ylläpito"]
    Energia ja polttoaineet: ["Rakennusten ja alueiden ylläpito", "Aineet, tarvikkeet ja tavarat"]
    Ympäristö, viheralueet ja jätehuolto: ["Alueet ja väylät", "Rakennusten ja alueiden ylläpito"]
    Elintarvikkeet ja ruokapalvelut: ["Majoitus- ja ravitsemispalvelut"]
    Turvallisuus ja puolustus: ["Rakennusten ja alueiden ylläpito", "Koneet, laitteet ja kuljetusvälineet"]
    Koulutus, tutkimus ja kulttuuri: ["Koulutus- ja kulttuuripalvelut"]

# KKV:n muu valvonta: hankintojen valvonta, esitykset markkinaoikeudelle, kielto-/sitoumus-/toimitusvelvoiteratkaisut, kilpailuneutraliteetti
# (+ päätössyöte samana päivänä). pages = montako listaussivua (10 tapausta/sivu) luokkaa kohden luetaan ajossa
kkv_valvonta:
  keep_days: 180
  pages: 3
