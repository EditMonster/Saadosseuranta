    "Energy": "Kestävyys ja ympäristö"
    "Maritime Affairs and Fisheries": "Kestävyys ja ympäristö"
    "Agriculture and Rural Development": "Kuluttaja ja tuotteet"
    "Mobility and Transport": "Kuluttaja ja tuotteet"
