# (e) Komitologiarekisteri – täytäntöönpanosäädösluonnokset ja komiteoiden äänestykset
# (ec.europa.eu/transparency/comitology-register; JSON-haku + päivittäinen CSV-aineisto draftMeasures)
komitologia:
  enabled: true
  days: 75                    # säädösluonnokset, joiden komiteakäsittely on alkanut tai tila muuttunut tällä välillä
  csv_refresh_hours: 20       # 64 MB:n CSV-aineisto (tilat, lausunnot, äänestyslomakkeet) haetaan enintään kerran päivässä
  max_detail_per_run: 40      # asiakirjakohtaiset haut (perussäädöksen CELEX, pääosasto) – uusimmat ensin, välimuistitetaan
  exclude_title_patterns:     # massapäätökset, joilla ei ole lainsäädännöllistä ennakointiarvoa
    - "award of (one|two|three|\\d+) grants?"
    - "marketing authori[sz]ation"
    - "renewal of the marketing"
    - "renewing the approval of the active substance"
    - "approving .* as an active substance"
    - "non-renewal of the approval"
    - "authorising the placing on the market of (products containing|foods|a food)"
    - "novel food"
    - "work programme .* for the implementation of"
    - "financing decision"
    - "annual action plan"
    - "individual measure in favour"
    - "ETIAS|SIS II|Eurodac"   # tekniset eritelmät
    - "Explanatory notes to the Combined Nomenclature"
    - "Union authorisation for the biocidal product"
    - "maximum residue levels? for"
    - "adopting the \\d{4} work programme"
  # Rekisterin tilat (CSV: Status) -> rivin tila
  tilat:
    "Draft Implementing Act submitted to Committee": "äänestys tulossa"
    "Draft Implementing Act submitted to committee": "äänestys tulossa"
    "Sent to committee": "äänestys tulossa"
    "Amendment (New draft)": "äänestys tulossa"
    "Postponed": "lykätty"
    "Postponed to next meeting": "lykätty"
    "Positive opinion": "hyväksytty komiteassa"
    "Adoption": "hyväksytty komiteassa"
    "Opinion of the committee (if necessary by vote)": "hyväksytty komiteassa"
    "Cmte fav. opinion and measure sent to EP and Council": "hyväksytty komiteassa"
    "No opposition by EP/Council": "hyväksytty komiteassa"
    "No opinion": "ei lausuntoa"
    "No opinion of the Appeal Committee": "ei lausuntoa"
    "Negative opinion": "kielteinen lausunto"
    "Appeal Committee": "muutoksenhakukomiteassa"
    "Adopted by Commission": "annettu"
    "Act adopted remains in Force": "annettu"
    "Withdrawn": "peruutettu"
  lausunnot:                  # CSV: Opinion
    "Favourable": "puoltava"
    "Positive": "puoltava"
    "Unfavourable": "kielteinen"
    "Negative": "kielteinen"
    "No opinion": "ei lausuntoa"
  # Pääosasto (CSV: Service, englanninkielinen pitkä nimi) -> aihealue, kun avainsanat eivät osu
  paaosastot:
    "Financial Stability, Financial Services and Capital Markets Union": "Yhtiö ja rahoitus"
