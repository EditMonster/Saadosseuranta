# (g) Valtioneuvoston kanslian neuvostokokousmuistiot eduskunnalle – EUN n/yyyy vp (avoindata.eduskunta.fi, VaskiData)
# Korvaa Cloudflaren takana olevan valtioneuvosto.fi:n EU-ministerivaliokunnan asialistat: sama kokous, sama
# Suomen kanta, noin viikkoa ennen neuvoston kokousta.
eun:
  enabled: true
  keep_days: 30               # pidetyt kokoukset pudotetaan näin monen päivän jälkeen
  backfill: 40                # ensimmäisellä ajolla haetaan näin monta uusinta numeroa
  miss_limit: 4               # numerointi loppuu, kun näin monta peräkkäistä numeroa puuttuu
  partial_retry_days: 21      # vain käsittelytietorivillä (ei VNK:n muistiota) olevat haetaan uudelleen tämän ajan
  # Neuvoston kokoonpano (nimekkeestä, osamerkkijono, ensimmäinen osuma voittaa) -> aihealue, kun asiasanat eivät osu
