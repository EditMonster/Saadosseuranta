# Ennakoivat EU-signaalit: komission suunnitelmat, neuvoston ja Coreperin esityslistat, parlamentin
# aikatauluennusteet, rikkomusmenettelyt Suomea vastaan, komitologia (täytäntöönpanosäädökset),
# pakotemuutokset ja valtioneuvoston neuvostokokousmuistiot (EUN-asiakirjat).
#
# Hakija: scripts/fetch_eu_signals.py -> data/cache/eu_signals.json (lohkot forward, council, forecasts,
# infringements, comitology, sanctions, eun; jokaisella oma health-merkintä, joten yhden lähteen vika ei
# kaada muita). Rakentaja: scripts/build_eu_signals.py (puhtaat funktiot, build.py kutsuu).
# Aihealueiden nimet = config/topics.yaml.

# (a) Komission ennakkosuunnitelmat – komission asiakirjarekisteri (ec.europa.eu/transparency/documents-register)
komissio:
  enabled: true
  # Viikoittainen "Liste des points prévus à l'ordre du jour des prochaines réunions de la Commission"
  # (SEC-asiakirja, tyyppi TENTAT_AGENDA_COM_MEETING): montako uusinta listaa pidetään (edellinen
  # mahdollistaa siirtymien havaitsemisen) ja kuinka monta päivää menneet kokouspäivät säilytetään
  weekly_lists: 2
  keep_days: 14
  search_days: 60            # kuinka vanhoja listoja rekisteristä haetaan
  # Komission työohjelman liite I (uudet aloitteet, viitteellinen vuosineljännes)
  cwp:
    enabled: true
    keywords: "Commission work programme"
    languages: [fi, en]      # suomenkielinen liite kun saatavilla, englanti rinnalle nimien täsmäytystä varten
    max_age_days: 450        # vanhempaa työohjelmaa ei enää käytetä
  # Vastuuhenkilölyhenteet listalla -> komissaarin nimi (näytetään rivillä)
  vastuuhenkilot:
    PRESIDENT: "puheenjohtaja von der Leyen"
    RIBERA: "Ribera (EVP)"
    VIRKKUNEN: "Virkkunen (EVP)"
    SÉJOURNÉ: "Séjourné (EVP)"
    SEJOURNE: "Séjourné (EVP)"
    FITTO: "Fitto (EVP)"
    MÎNZATU: "Mînzatu (EVP)"
    MINZATU: "Mînzatu (EVP)"
    KALLAS: "Kallas (HR/VP)"
    DOMBROVSKIS: "Dombrovskis"
    ŠEFČOVIČ: "Šefčovič"
    SEFCOVIC: "Šefčovič"

# Komission suunnitelmien yhdistäminen (viikkolista + työohjelma) ja säilytys
planned_initiatives:
  weekly_list: true           # viikkolistan kohdat mukaan signaaleina
  cwp: true                   # työohjelman aloitteet mukaan signaaleina
  match_threshold: 0.62       # otsikoiden samankaltaisuus (0–1), jolla viikkolistan kohta ja työohjelman aloite yhdistetään
  keep_past_days: 60          # suunniteltu päivä (vuosineljänneksen loppu) saa olla enintään näin monta päivää menneisyydessä
  quarter_month_offset: 1     # Q -> tapahtumapäivä: vuosineljänneksen (1 + offset). kuukauden 1. päivä (Q2 -> 1.5.)

# (b) Neuvoston ja Coreperin esityslistat – julkaisutoimiston Cellar (CONSIL FilePlanning: AGENDA_DRAFT_CONSIL)
neuvosto:
  enabled: true
  lookback_days: 14           # esityslistat, jotka on annettu tällä välillä (kattaa n. 3 viikkoa eteenpäin)
  keep_days: 7                # pidetyt kokoukset pudotetaan näin monen päivän jälkeen
  include_working_parties: false   # työryhmien esityslistat (paljon rivejä, vähän ennakointiarvoa)
  elimet:                     # Cellarin englanninkielinen ilmaisun nimi -> suomi
    "PERMANENT REPRESENTATIVES COMMITTEE (Part 1)": "Coreper I"
    "PERMANENT REPRESENTATIVES COMMITTEE (Part 2)": "Coreper II"
    "SPECIAL COMMITTEE ON AGRICULTURE": "Maatalouden erityiskomitea"
  kokoonpanot:                # "COUNCIL OF THE EUROPEAN UNION (<kokoonpano>)" -> suomi
    "General Affairs": "Yleisten asioiden neuvosto"
    "Foreign Affairs": "Ulkoasiainneuvosto"
    "Foreign Affairs (Trade)": "Ulkoasiainneuvosto (kauppa)"
    "Foreign Affairs (Defence)": "Ulkoasiainneuvosto (puolustus)"
    "Foreign Affairs (Development)": "Ulkoasiainneuvosto (kehitys)"
    "Economic and Financial Affairs": "Talous- ja rahoitusasioiden neuvosto (Ecofin)"
    "Economic and Financial Affairs (Budget)": "Talous- ja rahoitusasioiden neuvosto (budjetti)"
    "Justice and Home Affairs": "Oikeus- ja sisäasioiden neuvosto"
    "Employment, Social Policy, Health and Consumer Affairs": "Työllisyys-, sosiaalipolitiikka-, terveys- ja kuluttaja-asioiden neuvosto"
    "Competitiveness (Internal Market, Industry, Research and Space)": "Kilpailukykyneuvosto"
    "Competitiveness (Internal Market, Industry and Research)": "Kilpailukykyneuvosto"
    "Transport, Telecommunications and Energy": "Liikenne-, televiestintä- ja energianeuvosto"
    "Transport, Telecommunications and Energy (Transport)": "Liikenne-, televiestintä- ja energianeuvosto (liikenne)"
    "Transport, Telecommunications and Energy (Telecommunications)": "Liikenne-, televiestintä- ja energianeuvosto (televiestintä)"
    "Transport, Telecommunications and Energy (Energy)": "Liikenne-, televiestintä- ja energianeuvosto (energia)"
    "Agriculture and Fisheries": "Maatalous- ja kalastusneuvosto"
    "Environment": "Ympäristöneuvosto"
    "Education, Youth, Culture and Sport": "Koulutus-, nuoriso-, kulttuuri- ja urheiluneuvosto"
  # Cellarin suunniteltujen tapahtumien tyypit -> aikajanan nimi (muut tyypit: "esityslistalla")
  tapahtumat:
    DELIB_COREPER_byCONSIL: "käsittely"
    ADP_MAND_NGT_INST_COREPER_byCONSIL: "neuvotteluvaltuudet"
    ENDORSE_AGRPROV_COREPER_byCONSIL: "alustavan sovun vahvistaminen"
    ADP_NEGMAN_SPCOM_byCONSIL: "neuvotteluvaltuudet"
    PART_APPRGEN_byCONSIL: "osittainen yleisnäkemys"
    ADP_APPRGEN_byCONSIL: "yleisnäkemys"
    APR_R1_byCONSIL: "säädöksen hyväksyminen (A-kohta)"
    APR_R2_byCONSIL: "säädöksen hyväksyminen (2. käsittely)"
    ADP_R1_POS_byCONSIL: "ensimmäisen käsittelyn kanta"
    AGR_byCONSIL: "poliittinen yhteisymmärrys"
    DELIB_byCONSIL: "keskustelu"
    DIS_byCONSIL: "käsittely"

# (c) Parlamentin aikatauluennusteet – OEIL (Legislative Observatory) ennustelohko + EP:n avoimen datan
# täysistunnon esityslistat (data.europarl.europa.eu; nopeusraja: enintään 1 pyyntö / 2–3 s)
ennusteet:
  enabled: true
  max_per_run: 50             # montako OEIL-menettelyä haetaan yhdellä ajolla (vakaassa tilassa riittää n. 30/pv)
  refresh_days: 7             # ennuste haetaan uudelleen näin usein (seurantalistan menettelyt: päivittäin)
  watchlist_refresh_days: 1
  delay_seconds: 1.0          # OEIL-pyyntöjen väli
  ep_agenda: true             # EP:n täysistunnon esityslistat (tarkat äänestyspäivät, suomenkieliset otsikot)
  ep_agenda_sittings: 4       # montako seuraavaa istuntopäivää haetaan (yksi istuntoviikko = 4 päivää)
  ep_delay_seconds: 3.0
  # OEIL:n ennustetekstit -> luokka (plenary = täysistunto, committee = valiokunnan äänestys); muut -> otherForecasts
  luokat:
    plenary: ["vote in plenary", "indicative plenary sitting date", "debate in plenary", "plenary sitting"]
    committee: ["committee", "vote scheduled in committee", "indicative committee"]

