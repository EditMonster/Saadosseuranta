    "Formal notice Art. 260": "virallinen ilmoitus (SEUT 260 art., tuomion noudattamatta jättäminen)"
    "Letter of formal notice Art. 260": "virallinen ilmoitus (SEUT 260 art., tuomion noudattamatta jättäminen)"
    "Formal notice": "virallinen ilmoitus"
    "Letter of formal notice": "virallinen ilmoitus"
    "Additional reasoned opinion": "täydentävä perusteltu lausunto"
    "Reasoned opinion": "perusteltu lausunto"
