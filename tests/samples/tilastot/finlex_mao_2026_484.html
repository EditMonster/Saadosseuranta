<script>self.__next_f.push([1,"f0:[\"$\",\"p\",\"2\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"Markkinaoikeus toteaa, että hankintayksiköllä on velvollisuus pyytää selvitystä ja tarjoajalla velvollisuus antaa selvitys hankintayksikön pyynnöstä aina, kun kysymyksessä on poikkeuksellisen alhaiselta vaikuttava tarjous. Tarjotun hinnan tai kustannusten poikkeuksellisuuden arvioiminen on kuitenkin hankintayksiköiden harkintavallassa. Hinnan tai kustannusten poikkeuksellisuutta arvioitaessa voidaan kiinnittää huomiota muun muassa hankinnan laatuun ja laajuuteen sekä toimitusaikaan, hankinnan oikeudellisiin, taloudellisiin sekä teknisiin tekijöihin, muiden tarjoajien antamiin hintoihin sekä toimialalla tyypilliseen hinnoittelurakenteeseen. (Ks. myös HE 108/2016 vp s. 205.)\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"f1:[\"$\",\"p\",\"3\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"Hankintayksiköllä on edellä todetun perusteella velvollisuus pyytää selvitystä aina, kun kyseessä on poikkeuksellisen alhaiselta vaikuttava tarjous. Hankintayksiköllä on kuitenkin harkintavaltaa arvioida, milloin tarjoushinnan määräytymisen perusteita on aihetta selvittää. Hankintayksikön tulee perustaa arviointi todellisiin ja perusteltuihin seikkoihin, mutta hankintayksiköllä ei ole velvollisuutta edellyttää, että tarjoushinnat ovat vähintään tarjoajalle aiheutuvien kustannusten suuruisia.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
