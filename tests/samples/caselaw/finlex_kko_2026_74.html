<script>self.__next_f.push([1,"c2:[\"$\",\"p\",\"10\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"6. Pykälän 3 momentin mukaan vangitsemisesta päättävä tuomioistuin voi pakkokeinolain 2 luvun 9 §:ssä tarkoitetun pidättämiseen oikeutetun virkamiehen tai syyttäjän esityksestä päättää, että tutkintavanki sijoitetaan poliisin ylläpitämään tutkintavankien säilytystilaan, jos se on välttämätöntä tutkintavangin erillään pitämiseksi, turvallisuussyistä tai rikoksen selvittämiseksi. Tutkintavankia ei saa tällöinkään pitää poliisin säilytystilassa seitsemää vuorokautta pidempää aikaa, ellei siihen ole poikkeuksellisen painavaa, tutkintavangin turvallisuuteen, rikoksen esitutkintaan tai pakkokeinolain 2 luvun 5 §:n 1 momentin 2 b kohdassa tarkoitetusta vaarasta aiheutuvaa, erillään pitämiseen liittyvää syytä.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"c3:[\"$\",\"p\",\"11\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"7. Mainitussa 3 momentissa viitatun pakkokeinolain 2 luvun 5 §:n 1 momentin 2 b kohdan mukaan rikoksesta todennäköisin syin epäilty saadaan säädetyin edellytyksin pidättää, jos on syytä epäillä, että hän vaikeuttaa asian selvittämistä hävittämällä, turmelemalla, muuttamalla tai kätkemällä todistusaineistoa taikka vaikuttamalla todistajaan, asianomistajaan, asiantuntijaan tai rikoskumppaniinsa (sotkemisvaara).\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"de:T562,8. Tutkintavankeuslain 2 luvun 1 §:n 3 momenttia on muutettu 1.1.2019 voimaan tulleella lailla 103/2018. Lainmuutoksella aikaa, jonka tutkintavankia voidaan pitää poliisin ylläpitämässä säilytystilassa, lyhennettiin neljästä viikosta seitsemään päivään. Lainmuutokseen johtaneessa hallituksen esityksessä todetaan, että kansainväliset valvontaelimet ja eduskunnan oikeusasiamies ovat toistuvasti arvostelleet Suomea siitä, että tutkintavankeja säilytetään poliisin tiloissa. Esitutkinnan selvittämisvastuun ja vastuun tutkintavangin olosuhteista ja säilyttämisestä tulisi olla eri viranomaistahoilla painostamis- ja lahjomisvaaran estämiseksi. Poliisivankiloiden säilytystilojen olosuhteet, niissä tarjolla olevat mahdollisuudet sellin ulkopuolella järjestettävään toimintaan ja ulkoiluun sekä terveydenhuoltopalvelut ovat puutteelliset. Poliisivankiloita ei ole suunniteltu vapautensa menettäneiden pitkäaikaiseen säilyttämiseen. (HE 252/2016 vp s. 6 ja 26.) Tutkintavankien poliisivankiloissa säilyttämisen vähentämiseksi tutkintavangin säilytysaikaa poliisivankilassa esitettiin lyhennettäväksi siten, että tutkintavanki olisi siirrettävä tutkintavankilaan aiempaa nopeammin. Pidemmän aikavälin tavoitteeksi on todettu tutkintavankien siirtäminen vankilaan heti vangitsemisoikeudenkäynnin jälkeen. (HE 252/2016 vp s. 30.)c4:[\"$\",\"p\",\"12\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"$de\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"c5:[\"$\",\"p\",\"13\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"9. Tutkintavankeuslain 2 luvun 1 §:n 3 momentin perusteluiden mukaan seitsemää vuorokautta pidempi säilyttäminen poliisin säilytystilassa tulisi kysymykseen ainoastaan joissakin, harvoissa ja poikkeuksellisissa tilanteissa, kun siihen olisi tutkintavangin turvallisuuteen tai erillään pitämiseen liittyvä painava syy. Erillään pitämiseen liittyvä painava syy olisi olemassa säännöksen mukaan ainoastaan tilanteessa, jossa vankilaan sijoittamiseen liittyisi pakkokeinolain 2 luvun 5 §:n 1 momentin 2 b kohdassa tarkoitettu esitutkinnan vaikeuttamisvaara. (HE 252/2016 vp s. 50.)\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"c6:[\"$\",\"p\",\"14\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"10. Tutkintavankeuslain 2 luvun 1 §:n 3 momenttia täsmennettiin eduskuntakäsittelyssä lakivaliokunnan ehdotuksesta niin, että tutkintavankia saa säilyttää poliisin säilytystilassa seitsemää vuorokautta pidempään myös, jos siihen olisi poikkeuksellisen painava rikoksen esitutkintaan liittyvä syy. Tämä koskisi esimerkiksi tilanteita, joissa esitutkinta olisi niin keskeneräinen, että tutkintavangin siirtäminen kaukana sijaitsevaan vankilaan vaarantaisi koko esitutkinnan. Säännöksen soveltamisen kannalta merkityksellisiä voivat olla myös esimerkiksi järjestäytynyttä rikollisuutta ja ihmiskauppaa koskevat tilanteet. Säännös voisi soveltua tilanteisiin, joissa on kyse laajasta rikoskokonaisuudesta, jossa on useita epäiltyjä ja paljon yhteydenpitorajoituksia. (LaVM 10/2017 vp s. 6 ja 9.)\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"c8:[\"$\",\"p\",\"16\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"11. Korkein oikeus toteaa, että tutkintavankeuslain 2 luvun 1 §:ssä asetetaan portaittain tiukentuvia vaatimuksia tutkintavangin sijoittamiselle. Pykälän 1 momentissa todetun pääsäännön mukaan rikoksen johdosta vangittu henkilö on viipymättä vietävä tutkintavankilana toimivaan vankilaan. Tästä pääsäännöstä voidaan poiketa vain 3 momentissa säädetyin edellytyksin. Tutkintavangin poliisin säilytystilaan sijoittamisen edellytyksenä on sijoittamisen välttämättömyys laissa mainittujen perusteiden turvaamiseksi. Jos vielä seitsemän vuorokauden sijoitusaika ylitetään, edellytetään lisäksi poikkeuksellisen painavaa laissa mainittuihin perusteisiin liittyvää syytä.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"c9:[\"$\",\"p\",\"17\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"12. Korkein oikeus toteaa, että mainitun säännöksen tulkinnassa on otettava huomioon ne edellä kohdassa 8 kuvatut syyt ja tavoitteet, joita lakia muutettaessa on esitetty poliisin säilytystilaan sijoittamisen enimmäisajan lyhentämisen perusteeksi. Erityinen merkitys on periaatteellisilla ongelmilla, jotka liittyvät esitutkinnan suorittamiseen ja tutkintavangin säilyttämiseen saman viranomaistahon vastuulla. Korkein oikeus katsoo, että kynnys seitsemän vuorokauden ylittävälle sijoittamiselle on edellä todetun perusteella erittäin korkea ja se tulee kyseeseen vain harvoissa ja poikkeuksellisissa tilanteissa.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"ca:[\"$\",\"p\",\"18\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"13. Korkein oikeus toteaa, että tutkintavankeuslain 2 luvun 1 §:n 3 momentissa viitattu pakkokeinolain 2 luvun 5 §:n 1 momentin 2 b kohdassa tarkoitettu niin sanottu sotkemisvaara on edellytyksenä jo rikoksesta todennäköisin syin epäillyn vangitsemiselle. Selvää on, että vangitsemisen perusteeksi riittävä sotkemisvaara ei tällöin itsessään riitä perusteeksi sijoittaa tutkintavanki yli seitsemän vuorokauden ajaksi poliisin säilytystilaan, vaan tämä edellyttää merkittävästi korkeamman vaatimuksen, poikkeuksellisen painavan syyn täyttymistä. Poikkeuksellisen painavaa syytä arvioitaessa huomiota on kiinnitettävä siihen, minkälaisella painoarvolla sotkemisvaara yksittäisessä tapauksessa ilmenee. Tässä arvioinnissa merkitystä voi olla muun muassa esitutkinnan vaiheella ja sillä, onko epäillyllä liityntää järjestäytyneeseen rikollisuuteen.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"cb:[\"$\",\"p\",\"19\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"14. Säilyttämisajan pidentämistä koskevan vaatimuksen esittäjän velvollisuutena on vedota niihin konkreettisiin seikkoihin, joiden perusteella hän katsoo poikkeuksellisen painavan syyn olevan käsillä (ks. KKO 2022:4, kohta 7).\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"e1:T4b0,15. Rikoskomisario on vangitun sijoittamispaikan määräajan pidentämistä koskevan vaatimuksensa perusteina vedonnut siihen, että asian esitutkinta oli kesken ja asiassa oli edelleen merkittävä sotkemisvaara. Esitutkinnan perusteella kyse oli ulkomaisesta järjestäytyneestä rikollisryhmästä, jonka tavoite oli saada haltuunsa merkittävä rikoshyöty pankkiautomaatteja räjäyttämällä ja tämän jälkeen poistua maasta. A oli kiistänyt syyllistyneensä tutkittaviin rikoksiin, eikä hän ollut esitutkinnassa tai vangitsemista koskevassa istunnossa ottanut kantaa vaatimuksessa esitettyihin, hänen syyllisyyttään tukeviin seikkoihin. Rikoksissa käytettyjä tekovälineitä oli edelleen kateissa ja epäiltiin, että asiaan liittyi muitakin henkilöitä, joiden henkilöllisyys ei ollut vielä selvillä. A:n katsottiin voivan vaikeuttaa esitutkintaa viestimällä kanssaepäiltyjen kanssa esitutkinnasta ja pyrkiä vaikeuttamaan kateissa olevien tekovälineiden löytymistä. Oulun vankilassa kolmen samaan rikosasiaan liittyvän epäillyn eristäminen oli erittäin haastavaa eikä vankila voinut taata, että yhteydenpidon rajoitukset toteutuvat lain edellyttämällä tavalla.cd:[\"$\",\"p\",\"21\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"$e1\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"ce:[\"$\",\"p\",\"22\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"16. Rikoskomisario on lisäksi vedonnut siihen, että tapauksen esitutkinta oli hyvin haastavaa ja asiassa tuli valmistella kuulusteluja, joissa todistelua ja muita asioita käydään epäillyn kanssa läpi. Kuulusteluissa oli käytettävä puolan kielen tulkkeja, jotka olivat erittäin työllistettyjä ja heidän saamisensa kuulusteluihin oli erittäin vaikeaa. Oulun poliisivankilassa epäiltyjä voitiin kuulla tarvittaessa samaan aikaan, mikä ei onnistunut Oulun vankilassa. Tämä nopeutti asian esitutkintaa. Tutkintavangin edun mukaista oli, että Oulun poliisivankilassa hänelle sallittu yhteydenpito lähiomaiseen voitiin toteuttaa paremmin, koska poliisi vastasi yhteydenpidon valvonnasta.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"cf:[\"$\",\"p\",\"23\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"17. A on vastustanut vaatimusta katsoen, että esitetyt perusteet koskivat seikkoja, joiden perusteella poliisin olisi helpompi toteuttaa esitutkintaa ja jotka säästäisivät poliisin aikaa. Asiassa ei ollut esitetty laissa tarkoitettua poikkeuksellisen painavaa syytä poliisivankilaan sijoittamisen jatkamiselle.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"d1:[\"$\",\"p\",\"25\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"18. Korkein oikeus toteaa, että vaikka esitutkinnan perusteella kyse on ollut järjestäytyneestä ulkomaisesta rikollisryhmästä, rikoksista epäiltynä on ollut vain kolme henkilöä. Korkein oikeus katsoo, että tätä ei ole pidettävä poikkeuksellisena tai edes suurena epäiltyjen määränä. Epäillyn rikoskokonaisuuden ei muutoinkaan ole selvitetty olleen erityisen laaja, vaikka tekoihin olisi mahdollisesti liittynyt joitakin muitakin henkilöitä. Näillä perusteilla esitutkinnan suorittamiseen tai yhteydenpitorajoitusten toteutumisen turvaamiseen ei ole liittynyt tavanomaisesta olennaisesti poikkeavia vaikeuksia. Korkein oikeus katsoo myös, ettei yhteydenpitorajoitusten mahdollisesti tehokkaammaksi koettu valvonta poliisin toimesta poliisivankilassa voi itsessään perustella sijoittamisen jatkamista poliisivankilassa seitsemää vuorokautta pidempään.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"d2:[\"$\",\"p\",\"26\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"19. Sotkemisvaaraan liittyvää poikkeuksellisen painavaa syytä arvioitaessa on otettava huomioon, että A:n yhteydenpitoa muihin kuin pakkokeinolain 4 luvun 1 §:n 3 momentissa tarkoitettuihin tahoihin oli rajoitettu. Rikosten kohteena olevaa omaisuutta ja tekovälineitä oli tavattu jo esitutkinnan alkuvaiheessa epäiltyjen hallusta. Tekoon liittyvän välineistön ja vaatetuksen osittainen kadoksissa oleminen ei ole tässä tapauksessa olennaisesti lisännyt sotkemisvaaran painoarvoa.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
<script>self.__next_f.push([1,"d3:[\"$\",\"p\",\"27\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[[\"$\",\"span\",\"0\",{\"className\":\"highlightable\",\"children\":\"20. Esitutkinnan on esitetty olleen alkuvaiheessa ja lisäkuulusteluille on katsottu olleen vielä tarvetta. Korkein oikeus katsoo, että esitutkintaviranomaisen toiminnan sujuvoituminen tai muukaan helpottuminen ei tue poikkeuksellisen painavan syyn edellytyksen täyttymistä. Asiassa ei ole ilmennyt, että epäiltyjen sijoittaminen vankilaan vaarantaisi koko esitutkinnan.\"}],\"$undefined\"]}]],\"className\":\"styles-module-scss-module__k0zOmW__bodyText\",\"style\":{\"--color\":\"$undefined\",\"--markerColor\":\"$undefined\"}}]\n"])</script>
